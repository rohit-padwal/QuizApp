# Define a 'Persistent Voulume Claim'(PVC) for postgresql Storage, dynamically provisioned by cluster
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pv-claim # name of PVC essential for identifying the storage data
  labels:
    app: postgresql
    tier: database
spec:
  accessModes:
    - ReadWriteOnce   #This specifies the mode of the claim that we are trying to create.
  resources:
    requests:
      storage: 1Gi    #This will tell kubernetes about the amount of space we are trying to claim.
---
# Configure 'Deployment' of postgresql server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  labels:
    app: postgresql
    tier: database
spec:
  selector: # postgresql Pod Should contain same labels
    matchLabels:
      app: postgresql
      tier: database
  strategy:
    type: Recreate
  template:
    metadata:
      labels: # Must match 'Service' and 'Deployment' selectors
        app: postgresql
        tier: database
    spec:
      containers:
        - image: postgresql:15 # image from docker-hub
          args:
            - "--ignore-db-dir=lost+found" # Workaround for https://github.com/docker-library/postgresql/issues/186
          name: postgresql
          env:
            - name: postgresql_ROOT_PASSWORD
              value: 12345
            - name: postgresql_DATABASE # Setting Database Name from a 'ConfigMap'
              value: questiondb
          ports:
            - containerPort: 3306
              name: postgresql
          volumeMounts:        # Mounting voulume obtained from Persistent Volume Claim
            - name: postgresql-persistent-storage
              mountPath: /var/lib/postgresql #This is the path in the container on which the mounting will take place.
      volumes:
        - name: postgresql-persistent-storage # Obtaining 'vloume' from PVC
          persistentVolumeClaim:
            claimName: postgresql-pv-claim
---
# Define a 'Service' To Expose postgresql to Other Services
apiVersion: v1
kind: Service
metadata:
  name: postgresql  # DNS name
  labels:
    app: postgresql
    tier: database
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:       # postgresql Pod Should contain same labels
    app: postgresql
    tier: database
  clusterIP: None  # We Use DNS, Thus ClusterIP is not relevant